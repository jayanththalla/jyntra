name: refresh-company-boards
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync company boards (continues on the server)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://jyntra.vercel.app}"
          CRON_SECRET="${CRON_SECRET:-c5c987788a6f0ca6a58706aba3f76028271fe1dc12339cfb}"
          echo "Syncing company boards on $APP_URL..."
          curl --silent --show-error --max-time 60 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh?scope=boards" || echo "Board sync completed with warning."
