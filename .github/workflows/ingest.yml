name: ingest-jobs
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions: {}
concurrency: { group: ingest-jobs, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --include=dev || npm install --include=dev
      - name: Drain due sources
        continue-on-error: true
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", JOB_SYNC_BUDGET_MS: "600000" }
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL provided; running jobs:sync..."
            npm run jobs:sync || echo "jobs:sync ended with notice."
          else
            echo "DATABASE_URL secret is not configured in GitHub Secrets; skipping direct database job sync."
          fi
      - name: Daily discovery step (bounded by JOB_DISCOVERY_DAILY_LIMIT)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm run jobs:discover || echo "jobs:discover ended with notice."
          else
            echo "DATABASE_URL secret is not configured; skipping discover."
          fi
