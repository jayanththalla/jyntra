name: refresh-data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh funding news (runs inline)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://jyntra.vercel.app}"
          CRON_SECRET="${CRON_SECRET:-c5c987788a6f0ca6a58706aba3f76028271fe1dc12339cfb}"
          echo "Triggering funding news refresh on $APP_URL..."
          curl --silent --show-error --max-time 120 --retry 3 --retry-delay 5 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh?scope=news" || echo "News refresh warning/timeout, continuing."

      - name: Company jobs sync (directory apply links; continues on the server)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://jyntra.vercel.app}"
          CRON_SECRET="${CRON_SECRET:-c5c987788a6f0ca6a58706aba3f76028271fe1dc12339cfb}"
          echo "Triggering company sync on $APP_URL..."
          curl --silent --show-error --max-time 120 --retry 3 --retry-delay 5 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh?scope=companies" || echo "Companies refresh warning/timeout, continuing."

      - name: Start startups and jobs discovery (continues in the background on the server)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://jyntra.vercel.app}"
          CRON_SECRET="${CRON_SECRET:-c5c987788a6f0ca6a58706aba3f76028271fe1dc12339cfb}"
          echo "Triggering discovery on $APP_URL..."
          curl --silent --show-error --max-time 60 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh?scope=discovery" || echo "Discovery warning/timeout, continuing."

      - name: Check source health (diagnostics check)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://jyntra.vercel.app}"
          CRON_SECRET="${CRON_SECRET:-c5c987788a6f0ca6a58706aba3f76028271fe1dc12339cfb}"
          echo "Checking source health on $APP_URL..."
          curl --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh?scope=health" || echo "Health check finished with notices."
